  <!-- ── Main ───────────────────────────────────────────────────────────── -->
  <main class="ca-main">

    <!-- Step 1: Product selector -->
    <section id="view-selector" class="ca-section">
      <h1 class="ca-h1">Select products to scan</h1>
      <p class="ca-muted">Choose one or more IBM product communities. The advisor will retrieve open threads and generate suggested responses.</p>

      <div id="product-grid" class="ca-product-grid">
        <div class="ca-skeleton" style="height:120px"></div>
        <div class="ca-skeleton" style="height:120px"></div>
      </div>

      <div class="ca-actions">
        <button id="btn-scan" class="ca-btn ca-btn--primary" disabled>
          <svg viewBox="0 0 16 16" width="16" height="16"><path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 1.5a5.5 5.5 0 1 1 0 11 5.5 5.5 0 0 1 0-11zm0 2.25a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm-.75 3h1.5v4h-1.5z" fill="currentColor"/></svg>
          Run Report
        </button>
        <span id="scan-status" class="ca-status"></span>
      </div>
    </section>

    <!-- Step 2: Results (hidden until scan) -->
    <section id="view-results" class="ca-section ca-hidden">

      <!-- Back button -->
      <div class="ca-results-header">
        <button id="btn-new-scan" class="ca-btn ca-btn--ghost ca-back-btn">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M10.5 3L5 8l5.5 5" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Back to product selector
        </button>
      </div>

      <!-- Tabs -->
      <nav class="ca-tabs" role="tablist">
        <button class="ca-tab ca-tab--active" data-tab="threads" role="tab">
          Unanswered Threads
          <span id="tab-count" class="ca-badge">0</span>
        </button>
        <button class="ca-tab" data-tab="analytics" role="tab">
          Theme Analytics
        </button>
      </nav>

      <!-- Threads tab -->
      <div id="tab-threads" class="ca-tab-panel">

        <!-- Zero-reply highlight -->
        <div id="zero-reply-section" class="ca-zero-section ca-hidden">
          <div class="ca-zero-section__header">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 5v4M8 11v1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Needs a first response
            <span id="zero-count" class="ca-badge ca-badge--red">0</span>
          </div>
          <div id="zero-reply-list" class="ca-zero-section__list"></div>
        </div>

        <div class="ca-toolbar">
          <input id="filter-input" class="ca-input" type="search" placeholder="Filter threads…" />
        </div>
        <div id="threads-list"></div>

        <!-- Excluded threads -->
        <div id="excluded-section" class="ca-excluded-section ca-hidden">
          <div class="ca-excluded-section__header">
            <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M4 8h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            Excluded by filter rules
            <span id="excluded-count" class="ca-badge ca-badge--gray">0</span>
          </div>
          <div id="excluded-list" class="ca-excluded-section__list"></div>
        </div>
      </div>

      <!-- Analytics tab -->
      <div id="tab-analytics" class="ca-tab-panel ca-hidden">
        <div class="ca-toolbar">
          <button id="btn-analyse" class="ca-btn ca-btn--primary">
            Analyse Themes
          </button>
          <span id="analyse-status" class="ca-status"></span>
        </div>
        <div id="analytics-content"></div>
      </div>

    </section>

  </main>

  <footer class="ca-footer">IBM Community Advisor · Built with IBM watsonx.ai · Internal use only</footer>

  <script src="app.js"></script>
</body>
</html>
